<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  docker/font-aliases.conf — 容器内的中日韩字体名映射(v12.421)

  为什么需要它:
  `lib/subtitle-burn.ts` 在 Linux 下请求的是 `Noto Sans CJK SC` / `Noto Sans JP` /
  `Noto Sans KR`。Alpine 的 `font-noto-cjk` 提供的是**泛 CJK 家族**
  (Noto Sans CJK SC/TC/JP/KR/HK),没有独立的 `Noto Sans JP` / `Noto Sans KR`。
  于是那两个名字在容器里解析不到,fontconfig 静默回退 DejaVu —— 日韩字幕全是方框。

  这不是猜的:v12.421 第一次跑 Docker workflow 时,Dockerfile 里的构建期自证
  当场把它拦了下来(「字体「Noto Sans JP」解析不到 Noto(回退到了 DejaVu Sans)」)。
  我本机没有 docker,验不了字体包提供哪些 family 名 —— 是那道自证替我验的。

  为什么改容器而不改代码:
  `Noto Sans JP` 是真实存在的独立字体,本机装了它的用户请求它是对的。
  把代码改成 `Noto Sans CJK JP` 会影响所有人,而问题只出在这个镜像里。
  所以在镜像内做名字映射 —— 谁的问题在谁那儿解决。
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Noto Sans JP</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans KR</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <!-- 繁体也一并映射:导出到港台平台时会用到 -->
  <match target="pattern">
    <test name="family"><string>Noto Sans TC</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
</fontconfig>
