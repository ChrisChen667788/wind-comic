name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # CI runs unit + integration tests with mocked providers — no real keys needed.
          NODE_ENV: test

  # v12.226(CI 加固 · 🟠-17):此前 CI 只有 tsc+vitest —— 20 个 playwright spec 从不跑、
  # 零安全扫描、零许可证审查。企业采购/尽调看的就是这三样,补齐。
  security:
    name: Security + License
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # 门槛设在 high:v12.226 已修掉 js-yaml/undici/ws 三个 high。
      # 余下 2 个 moderate(next→postcss)的官方"修复"是把 Next 16 降到 9.3.3,
      # 属荒谬回退,故不采纳、也不因此把 CI 弄红 —— 详见 VERSIONS v12.226。
      - name: npm audit (block on high/critical)
        run: npm audit --audit-level=high

      # 生产依赖 copyleft 门禁:出现未登记的 GPL/LGPL/MPL 依赖即阻断。
      # 已登记:ffmpeg-static(GPL-3)、lightningcss(MPL-2)、@img/sharp-libvips(LGPL-3)。
      - name: License check (copyleft gate)
        run: node scripts/license-check.mjs

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # 注意:playwright.config.ts 两个 project 都用 `channel: 'chrome'`(真 Chrome,非 chromium),
      # 装错成 chromium 会让 CI 必挂 —— 这里必须装 chrome 通道。
      - name: Install Playwright browser (chrome channel)
        run: npx playwright install --with-deps chrome

      # 核心创作路径 smoke —— 不跑全部 20 个 spec(部分依赖真实引擎/长流程,
      # 在 CI 上会成为不稳定源);先把「页面能起、主链路可达」锁住,再逐步扩。
      - name: E2E smoke
        run: npx playwright test e2e/smoke.spec.ts --reporter=line
        env:
          NODE_ENV: test
          # 全程假引擎,不发任何真实外呼、不花钱
          MOCK_ENGINES: '1'
          # e2e 的 server 与测试进程须同一密钥,否则 JWT 不匹配全 401(v12.x 踩过的坑)
          JWT_SECRET: e2e-ci-fixture-secret-not-for-prod
          OPENAI_API_KEY: dummy

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Provide dummy values so Next.js build doesn't fail on missing env at module load.
          # No real outbound calls are made during build.
          OPENAI_API_KEY: dummy
          JWT_SECRET: dummy_for_build_only_change_in_production
