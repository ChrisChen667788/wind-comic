name: CI

# v12.239(第五轮对抗复检):显式收敛 GITHUB_TOKEN 权限。
# 此前无 permissions 块 = 继承仓库默认(常为 contents:write),任何一步的第三方
# action 若被供应链攻击即可改代码/发 release。本 workflow 全部步骤只需读代码。
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 2026-08-06 Actions 大规模故障期间 webhook 被限流(只处理 ~15%),两次推 main 都没触发 CI,
  # 且恢复后不追溯补触发。留一个手动触发口:`gh workflow run CI --ref main`,
  # 免得每次都要靠推空提交来换一次 CI。
  workflow_dispatch:

jobs:
  test:
    name: Test + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      # v12.290:fetch-depth: 0 拉全量历史 —— 否则默认浅克隆(depth=1)会让
      # tests/v12-290 里三条「哈希可达性」断言全部 skipIf(shallow) 静默跳过,
      # 护栏在 CI 里等于不存在(本地完整克隆才跑得到)。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # CI runs unit + integration tests with mocked providers — no real keys needed.
          NODE_ENV: test

  # v12.226(CI 加固 · 🟠-17):此前 CI 只有 tsc+vitest —— 20 个 playwright spec 从不跑、
  # 零安全扫描、零许可证审查。企业采购/尽调看的就是这三样,补齐。
  security:
    name: Security + License
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v12.290:完整历史 —— 下方 version-hashes 步骤要判断哈希在 main 里是否可达
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # 门槛设在 high:v12.226 已修掉 js-yaml/undici/ws 三个 high。
      # 余下 2 个 moderate(next→postcss)的官方"修复"是把 Next 16 降到 9.3.3,
      # 属荒谬回退,故不采纳、也不因此把 CI 弄红 —— 详见 VERSIONS v12.226。
      - name: npm audit (block on high/critical)
        run: npm audit --audit-level=high

      # 生产依赖 copyleft 门禁:出现未登记的 GPL/LGPL/MPL 依赖即阻断。
      # 已登记:ffmpeg-static(GPL-3)、lightningcss(MPL-2)、@img/sharp-libvips(LGPL-3)。
      - name: License check (copyleft gate)
        run: node scripts/license-check.mjs

      # v12.240:消费方门禁 —— 拦「改了守卫/判定层却没跟到消费方」这类绕过。
      # 这个病在 v12.218→239 犯了五次,每次都靠人肉对抗复检才发现;门禁负责让下一次当场被拦。
      # 只阻断**新增**违规(存量记在 lib/consumer-gate/baseline.json 里当技术债)。
      - name: Consumer gate (唯一入口不得被绕过)
        run: npx tsx scripts/consumer-gate.mjs

      # v12.290:变更日志溯源门禁 —— VERSIONS.md 里记的提交哈希必须在 main 历史中可达。
      # 病根是「commit → sed 哈希 → git commit --amend」写进去的是**被 amend 丢弃的游离哈希**,
      # 498 条里 247 条不可达。本步骤同时拦「陈旧待填」(发版漏跑回填脚本)。
      - name: Version hash provenance (变更日志可溯源)
        run: npm run check:version-hashes

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # 注意:playwright.config.ts 两个 project 都用 `channel: 'chrome'`(真 Chrome,非 chromium),
      # 装错成 chromium 会让 CI 必挂 —— 这里必须装 chrome 通道。
      - name: Install Playwright browser (chrome channel)
        run: npx playwright install --with-deps chrome

      # 核心创作路径 smoke —— 不跑全部 20 个 spec(部分依赖真实引擎/长流程,
      # 在 CI 上会成为不稳定源);先把「页面能起、主链路可达」锁住,再逐步扩。
      - name: E2E smoke
        run: npx playwright test e2e/smoke.spec.ts --reporter=line
        env:
          NODE_ENV: test
          # 全程假引擎,不发任何真实外呼、不花钱
          MOCK_ENGINES: '1'
          # e2e 的 server 与测试进程须同一密钥,否则 JWT 不匹配全 401(v12.x 踩过的坑)
          JWT_SECRET: e2e-ci-fixture-secret-not-for-prod
          OPENAI_API_KEY: dummy

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Provide dummy values so Next.js build doesn't fail on missing env at module load.
          # No real outbound calls are made during build.
          OPENAI_API_KEY: dummy
          JWT_SECRET: dummy_for_build_only_change_in_production
