# v12.226(CI 加固 · 企业采购门槛 · 🟠-17)
# 依赖自动跟进:每周拉一次补丁/小版本 PR,把「零安全跟进」变成有节奏的例行维护。
# 大版本(major)刻意不自动开 PR —— Next/React 这类升级要人工评估破坏面。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # 开发依赖打包成一个 PR,减少噪音
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # 生产依赖的补丁级也合并,安全补丁优先单独出 PR(dependabot 默认行为)
      prod-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # major 升级人工评估:Next 16 / React 19 的破坏面需要逐版验证
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # React 19.3 暂时升不了:@react-three/fiber 9.7.0(3D 导演台)的 peer 是
      # react / react-dom 「>=19 <19.3」,单升任何一个 npm install 都 ERESOLVE(#48 #49)。
      # 类型包一起挡住,免得类型跑到运行时前面。
      # 解锁条件:npm view @react-three/fiber peerDependencies 不再带 <19.3 时,
      # 删掉这四条,把 r3f + react + react-dom + 两个 @types 放进同一个 PR 一次升。
      - dependency-name: react
        versions: [">=19.3.0"]
      - dependency-name: react-dom
        versions: [">=19.3.0"]
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
